<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>聖誕贖醉日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #4a1520; --bg-deep: #2e0b13; --gold: #c9a24a; --gold-hi: #f3dc9a; --cream: #efe2ce; --ink: #f6eee3; --muted: rgba(246, 238, 227, .62); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden; color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, #5c1b29 0%, var(--bg) 45%, var(--bg-deep) 100%);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main { position: relative; width: 100%; max-width: 380px; text-align: center; }

  h1 {
    font-family: "Noto Serif TC", serif; font-weight: 900; margin: 0; letter-spacing: .06em; white-space: nowrap;
    font-size: clamp(40px, 12vw, 64px);
    background: linear-gradient(100deg, var(--ink) 0%, var(--ink) 40%, var(--gold-hi) 50%, var(--ink) 60%, var(--ink) 100%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 4.5s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }
  .sub { margin: 10px 0 0; font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--muted); font-size: 17px; }

  /* 蠟封 */
  .seal { position: relative; width: 92px; height: 92px; margin: 28px auto 22px; }
  .seal .half {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e9c873, var(--gold) 45%, #8a6a26 100%);
    box-shadow: inset 0 0 0 5px rgba(0, 0, 0, .12), inset 0 0 0 9px rgba(255, 255, 255, .12), 0 6px 18px rgba(0, 0, 0, .35);
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 40px; color: #5a3c10;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
    transition: transform .7s cubic-bezier(.3, .1, .3, 1), opacity .7s;
  }
  .seal .l { clip-path: polygon(0 0, 52% 0, 44% 22%, 56% 40%, 45% 58%, 55% 78%, 48% 100%, 0 100%); }
  .seal .r { clip-path: polygon(52% 0, 100% 0, 100% 100%, 48% 100%, 55% 78%, 45% 58%, 56% 40%, 44% 22%); }
  .seal.broken .l { transform: translate(-34px, 18px) rotate(-28deg); opacity: 0; }
  .seal.broken .r { transform: translate(34px, 18px) rotate(28deg); opacity: 0; }
  .seal.nudge { animation: nudge .5s; }
  @keyframes nudge { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

  p.ask { margin: 0 0 14px; letter-spacing: .3em; color: var(--muted); }
  input {
    width: 100%; padding: 14px 16px; font-size: 16px; text-align: center; letter-spacing: .1em;
    background: rgba(0, 0, 0, .15); color: var(--ink); border: 1px solid rgba(239, 226, 206, .35); border-radius: 0; outline: none;
  }
  input:focus { border-color: var(--gold); }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  button {
    width: 100%; margin-top: 12px; padding: 14px; font-size: 15px; letter-spacing: .3em; cursor: pointer;
    background: var(--cream); color: #3a2519; border: 0; border-left: 3px solid var(--gold); font-family: inherit;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .err { min-height: 52px; margin-top: 16px; color: #f0b48e; font-size: 15px; letter-spacing: .08em; }
  .shots { display: block; margin-top: 6px; font-size: 20px; letter-spacing: 4px; }
  .shots span { display: inline-block; animation: drop .35s ease-out; }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }

  /* 布幕 */
  .curtain { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .curtain div {
    position: absolute; top: 0; bottom: 0; width: 50.5%;
    background: linear-gradient(90deg, rgba(0,0,0,.4), rgba(0,0,0,0) 35%, rgba(255,255,255,.07) 50%, rgba(0,0,0,0) 65%, rgba(0,0,0,.4)), #5a1626;
    background-size: 54px 100%;
    box-shadow: inset 0 -40px 60px rgba(0,0,0,.35);
    transition: transform .65s cubic-bezier(.7, 0, .3, 1);
  }
  .curtain div:first-child { left: 0; transform: translateX(-101%); border-right: 2px solid var(--gold); }
  .curtain div:last-child { right: 0; transform: translateX(101%); border-left: 2px solid var(--gold); }
  .curtain.shut div { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    h1, .seal.nudge, .shake, .shots span { animation: none; }
    .seal .half, .curtain div { transition: none; }
  }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <h1>聖誕贖醉日</h1>
  <p class="sub">We listen but we don't judge.</p>
  <div class="seal" id="seal" aria-hidden="true"><div class="half l">贖</div><div class="half r">贖</div></div>
  <form id="f">
    <p class="ask">請輸入通關密語</p>
    <input id="pw" type="password" autocomplete="current-password" autofocus aria-label="通關密語">
    <button id="go" type="submit">進入</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<div class="curtain" id="curtain" aria-hidden="true"><div></div><div></div></div>

const KEY = "xmas-pass";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c));
  return new TextDecoder().decode(pt);
}

function show(html) {
  try { sessionStorage.setItem("xmas-curtain", "1"); } catch (e) {}
  const hash = location.hash;
  document.open(); document.write(html); document.close();
  if (hash) setTimeout(() => document.querySelector(hash)?.scrollIntoView(), 50);
}

async function ceremony(html) {
  document.getElementById("seal").classList.add("broken");
  await wait(550);
  document.getElementById("curtain").classList.add("shut");
  await wait(700);
  show(html);
}

const f = document.getElementById("f"), input = document.getElementById("pw");
const btn = document.getElementById("go"), err = document.getElementById("err"), seal = document.getElementById("seal");
let misses = 0;

f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = input.value.trim();
  if (!pw) return;
  btn.disabled = true; btn.textContent = "解鎖中…";
  try {
    const html = await unlock(pw);
    err.textContent = "";
    await ceremony(html);
  } catch {
    misses++;
    err.innerHTML = "輸入錯誤了嗎？給我喝酒" + (misses > 1 ? `（第 ${misses} 杯）` : "") +
      `<span class="shots">${"<span>🥃</span>".repeat(Math.min(misses, 8))}</span>`;
    for (const [el, cls] of [[input, "shake"], [seal, "nudge"]]) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
    input.select();
    btn.disabled = false; btn.textContent = "進入";
  }
});

// 每次都要輸入密語；清掉舊版記住的密語
try { localStorage.removeItem(KEY); } catch (e) {}

// 飄雪
if (!reduce) {
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  let w, h, flakes;
  const resize = () => {
    w = c.width = innerWidth * devicePixelRatio; h = c.height = innerHeight * devicePixelRatio;
    flakes = Array.from({ length: Math.round(innerWidth / 9) }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.8 + .6) * devicePixelRatio,
      v: (Math.random() * .5 + .3) * devicePixelRatio, d: Math.random() * Math.PI * 2,
    }));
  };
  resize(); addEventListener("resize", resize);
  (function tick() {
    ctx.clearRect(0, 0, w, h);
    for (const p of flakes) {
      p.y += p.v; p.d += .01; p.x += Math.sin(p.d) * .4;
      if (p.y > h) { p.y = -5; p.x = Math.random() * w; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.r > 1.6 * devicePixelRatio ? "rgba(243,220,154,.55)" : "rgba(246,238,227,.5)";
      ctx.fill();
    }
    requestAnimationFrame(tick);
  })();
}
</script>
