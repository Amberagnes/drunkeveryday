<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>聖誕贖醉日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #4a1520; --gold: #c9a24a; --cream: #efe2ce; --ink: #f6eee3; --muted: rgba(246, 238, 227, .62); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  h1 { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: clamp(40px, 12vw, 64px); margin: 0; letter-spacing: .06em; white-space: nowrap; }
  .rule { width: 140px; height: 1px; background: var(--gold); margin: 24px auto; }
  p { margin: 0 0 20px; letter-spacing: .3em; color: var(--muted); }
  input {
    width: 100%; padding: 14px 16px; font-size: 16px; text-align: center; letter-spacing: .1em;
    background: transparent; color: var(--ink); border: 1px solid rgba(239, 226, 206, .35); border-radius: 0; outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    width: 100%; margin-top: 12px; padding: 14px; font-size: 15px; letter-spacing: .3em; cursor: pointer;
    background: var(--cream); color: #3a2519; border: 0; border-left: 3px solid var(--gold); font-family: inherit;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .err { min-height: 24px; margin-top: 14px; color: #e8a37d; font-size: 14px; letter-spacing: .1em; }
  .quote { margin-top: 40px; font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>聖誕贖醉日</h1>
  <div class="rule"></div>
  <form id="f">
    <p>請輸入通關密語</p>
    <input id="pw" type="password" autocomplete="current-password" autofocus aria-label="通關密語">
    <button id="go" type="submit">進入</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="quote">We listen but we don't judge.</div>
</main>

const KEY = "xmas-pass";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c));
  return new TextDecoder().decode(pt);
}

function show(html) {
  const hash = location.hash;
  document.open(); document.write(html); document.close();
  if (hash) setTimeout(() => document.querySelector(hash)?.scrollIntoView(), 50);
}

async function attempt(pw, remember) {
  const html = await unlock(pw);
  if (remember) { try { localStorage.setItem(KEY, pw); } catch (e) {} }
  show(html);
}

const f = document.getElementById("f"), btn = document.getElementById("go"), err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value.trim();
  if (!pw) return;
  btn.disabled = true; btn.textContent = "解鎖中…"; err.textContent = "";
  try { await attempt(pw, true); }
  catch { err.textContent = "密語不對，再想想"; btn.disabled = false; btn.textContent = "進入"; }
});

// 同一台裝置輸入過就不用再輸入
let saved = null;
try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) attempt(saved, false).catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} });
</script>
